<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Alam Semesta V5: God Edition</title>
    <style>
        /* --- Reset & Base --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010102;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            user-select: none;
        }

        /* --- Canvas Layers --- */
        .canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #bgCanvas { z-index: 0; }
        #simCanvas { z-index: 1; cursor: crosshair; }

        /* --- UI Panel --- */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 340px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid rgba(79, 172, 254, 0.2);
            z-index: 100;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }
        
        /* Typography */
        h1 {
            font-size: 20px;
            margin: 0 0 15px 0;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .section-header {
            font-size: 10px;
            color: #5e80a3;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 8px 0;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }

        /* Inputs */
        .control-group { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #0072ff; height: 4px; background: #333; border-radius: 2px; appearance: none; }
        
        select {
            width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: white; border-radius: 6px;
            font-size: 12px; outline: none; cursor: pointer;
        }

        /* Mode Toggles */
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .mode-btn {
            padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px;
            text-align: center; font-size: 11px; cursor: pointer; transition: 0.2s; color: #888;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.1); }
        .mode-btn.active {
            background: rgba(0, 114, 255, 0.2); color: #00c6ff; border-color: rgba(0, 114, 255, 0.5); font-weight: bold;
        }

        /* Action Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
        button {
            padding: 10px; border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-normal { background: #222; color: #ddd; border: 1px solid #444; }
        .btn-normal:hover { background: #333; border-color: #666; }
        
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff); color: #000; grid-column: span 2;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); }

        .btn-tour {
             background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; grid-column: span 2;
        }

        /* HUD Overlay */
        #hud-display {
            pointer-events: none; /* Allow clicking through */
        }

        #fps-counter {
            position: absolute; top: 15px; right: 15px; font-family: monospace; color: #00c6ff;
            font-size: 12px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px;
        }

        #notification {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.8); border: 1px solid #00c6ff; color: #00c6ff;
            padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: bold;
            opacity: 0; transition: all 0.3s; pointer-events: none;
        }
        #notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .key-hint { font-size: 10px; color: #666; text-align: center; margin-top: 15px; line-height: 1.4; font-style: italic; }
    </style>
</head>
<body>

    <div id="fps-counter">FPS: 60</div>
    <div id="notification">Mode Changed</div>
    
    <canvas id="bgCanvas" class="canvas-layer"></canvas>
    <canvas id="simCanvas" class="canvas-layer"></canvas>

    <div id="ui-panel">
        <h1>COSMOS V5: GOD MODE</h1>
        
        <div class="section-header">Skenario Awal</div>
        <select id="scenario-select">
            <option value="galaxy">Spiral Galaxy</option>
            <option value="collision">Galaxy Collision</option>
            <option value="binary">Binary Star System</option>
            <option value="nebula_cluster">Star Clusters</option>
            <option value="random">Chaos Field</option>
            <option value="bigbang">The Big Bang</option>
        </select>

        <div class="section-header">Peralatan Dewa</div>
        <div class="mode-grid">
            <div class="mode-btn active" onclick="setMode('view')" id="mode-view" title="Geser & Zoom">📷 View</div>
            <div class="mode-btn" onclick="setMode('create')" id="mode-create" title="Buat Black Hole">⚫ Hole</div>
            <div class="mode-btn" onclick="setMode('meteor')" id="mode-meteor" title="Tembak Meteor">☄ Meteor</div>
            <div class="mode-btn" onclick="setMode('repulse')" id="mode-repulse" title="Ledakkan Area">💥 Blast</div>
        </div>

        <div class="section-header">Kontrol Semesta</div>
        <div class="control-group">
            <label>Waktu: <span id="time-val">1.0x</span></label>
            <input type="range" id="time-scale" min="0.0" max="3.0" value="1.0" step="0.1">
        </div>
        <div class="control-group">
            <label>Gravitasi: <span id="grav-val">0.6</span></label>
            <input type="range" id="gravity-strength" min="0.1" max="3.0" value="0.6" step="0.1">
        </div>

        <div class="section-header">Visual</div>
        <div class="control-group">
            <label>Jumlah Bintang: <span id="count-val">2000</span></label>
            <input type="range" id="star-count" min="500" max="4000" value="2000" step="100">
        </div>
        <div class="control-group">
            <label>Detail Ekor: <span id="trail-val">0.25</span></label>
            <input type="range" id="trail-length" min="0.05" max="0.5" value="0.25" step="0.05">
        </div>
        
        <div class="btn-grid">
            <button class="btn-normal" onclick="resetSim()">Reset</button>
            <button class="btn-normal" onclick="takeScreenshot()">📸 Snap</button>
            <button class="btn-tour" onclick="toggleAutoTour()" id="btn-tour">🎬 Auto Tour: OFF</button>
            <button class="btn-primary" onclick="togglePause()" id="btn-pause">Pause / Play</button>
        </div>
        
        <div class="key-hint">
            Scroll untuk Zoom In melihat Planet.<br>
            Double Click bintang untuk Analisis HUD.
        </div>
    </div>

<script>
    // --- ENGINE CORE ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    let width, height;
    let animationId;
    let isPaused = false;
    
    // Entities
    let stars = [];
    let debris = [];
    let gravityBodies = [];
    let bgStars = [];
    let nebulaClouds = [];

    // Camera & Interaction
    const camera = { x: 0, y: 0, zoom: 0.7, targetZoom: 0.7, dragging: false, lastX: 0, lastY: 0, following: null };
    const mouse = { x: 0, y: 0, screenX: 0, screenY: 0, down: false };
    let autoTourActive = false;
    let autoTourTimer = 0;

    // Settings
    const CONFIG = {
        count: 2000,
        G: 0.6,
        softening: 10,
        friction: 0.992,
        trail: 0.25,
        timeScale: 1.0,
        mode: 'view'
    };

    // --- CLASSES ---

    class Star {
        constructor(x, y, vx, vy, mass) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.mass = mass;
            this.size = Math.random() * 1.5 + 0.5;
            this.dead = false;
            
            // Klasifikasi Bintang & Warna
            const temp = Math.random();
            if (mass > 1.8) {
                this.type = "O-Class (Blue Giant)";
                this.hue = 200 + Math.random()*30; 
                this.temp = "30,000 K";
                this.color = hsl(${this.hue}, 90%, 75%);
            } else if (mass > 1.0) {
                this.type = "G-Class (Sun-like)";
                this.hue = 45 + Math.random()*20; 
                this.temp = "5,800 K";
                this.color = hsl(${this.hue}, 90%, 80%);
            } else {
                this.type = "M-Class (Red Dwarf)";
                this.hue = 0 + Math.random()*30; 
                this.temp = "3,000 K";
                this.color = hsl(${this.hue}, 90%, 65%);
            }
            
            // Sistem Planet (Baru di V5)
            this.planets = [];
            // Hanya bintang yang cukup besar punya planet
            if (Math.random() > 0.3) {
                const numPlanets = Math.floor(Math.random() * 4);
                for(let i=0; i<numPlanets; i++) {
                    this.planets.push({
                        dist: (this.size * 4) + (i * 5) + Math.random()*3,
                        angle: Math.random() * Math.PI * 2,
                        speed: (Math.random() * 0.05 + 0.02) * (Math.random() > 0.5 ? 1 : -1),
                        size: Math.random() * 0.8 + 0.3,
                        color: hsl(${Math.random()*360}, 70%, 60%)
                    });
                }
            }
        }

        update() {
            if (this.dead) return;

            // Physics N-Body Simplified
            let fx = 0, fy = 0;
            let closestDist = Infinity;
            let closestBody = null;

            for (let b of gravityBodies) {
                const dx = b.x - this.x;
                const dy = b.y - this.y;
                const distSq = dx*dx + dy*dy;
                const dist = Math.sqrt(distSq);

                if (dist < closestDist) {
                    closestDist = dist;
                    closestBody = b;
                }

                if (dist > 5) { 
                    const f = (CONFIG.G * b.mass) / (distSq + CONFIG.softening);
                    fx += (dx / dist) * f;
                    fy += (dy / dist) * f;
                }
            }

            // Interaksi Mouse
            if (mouse.down) {
                const wx = (mouse.screenX - width/2 - camera.x) / camera.zoom;
                const wy = (mouse.screenY - height/2 - camera.y) / camera.zoom;
                
                if (CONFIG.mode === 'repulse') {
                    const dx = wx - this.x;
                    const dy = wy - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 250) {
                        const force = -800 / (dist + 10);
                        fx += (dx/dist) * force;
                        fy += (dy/dist) * force;
                    }
                }
            }

            // Collision with Black Hole
            if (closestBody && closestDist < closestBody.radius * 0.6) {
                this.dead = true;
                createExplosion(this.x, this.y, this.hue, this.vx, this.vy, true); // True for shockwave
                closestBody.flash = 1.0; 
                return;
            }

            this.vx += fx * CONFIG.timeScale;
            this.vy += fy * CONFIG.timeScale;
            this.vx *= CONFIG.friction;
            this.vy *= CONFIG.friction;
            this.x += this.vx * CONFIG.timeScale;
            this.y += this.vy * CONFIG.timeScale;
            
            // Update Planet Angles
            for(let p of this.planets) {
                p.angle += p.speed * CONFIG.timeScale;
            }
        }

        draw(ctx, zoom) {
            if (this.dead) return;
            
            // Optimization: Culling
            // (Simple implementation omitted for brevity)

            // Draw Star
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fill();

            // Draw Planets (Level of Detail: Only if Zoom is high)
            if (zoom > 1.5 && this.planets.length > 0) {
                for(let p of this.planets) {
                    const px = this.x + Math.cos(p.angle) * p.dist;
                    const py = this.y + Math.sin(p.angle) * p.dist;
                    
                    // Orbit ring (very faint)
                    if (zoom > 2.5) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, p.dist, 0, Math.PI*2);
                        ctx.stroke();
                    }

                    // Planet body
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p.size, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
    }

    class Meteor {
        constructor(x, y, angle) {
            this.x = x;
            this.y = y;
            const speed = Math.random() * 10 + 5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.hue = Math.random() * 50 + 200; // Blueish
        }
        update() {
            this.x += this.vx * CONFIG.timeScale;
            this.y += this.vy * CONFIG.timeScale;
            this.life -= 0.01 * CONFIG.timeScale;
            // Gravity effect on meteor (light)
            for (let b of gravityBodies) {
                const dx = b.x - this.x;
                const dy = b.y - this.y;
                const d2 = dx*dx + dy*dy;
                if (d2 > 100) {
                    const f = (CONFIG.G * b.mass * 0.5) / d2; // Less affected
                    const d = Math.sqrt(d2);
                    this.vx += (dx/d)*f;
                    this.vy += (dy/d)*f;
                }
            }
        }
        draw(ctx) {
            ctx.strokeStyle = hsla(${this.hue}, 100%, 80%, ${this.life});
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.vx*2, this.y - this.vy*2); // Trail visual
            ctx.stroke();
        }
    }

    class GravityBody {
        constructor(x, y, mass, fixed = false) {
            this.x = x; this.y = y; this.mass = mass; this.fixed = fixed;
            this.vx = 0; this.vy = 0;
            this.radius = Math.sqrt(mass) / 1.8;
            this.flash = 0;
        }
        update() {
            if (!this.fixed) {
                for (let other of gravityBodies) {
                    if (other !== this) {
                        const dx = other.x - this.x;
                        const dy = other.y - this.y;
                        const d = Math.sqrt(dx*dx + dy*dy);
                        if (d > this.radius + other.radius) {
                            const f = (CONFIG.G * 0.15 * other.mass) / (d*d);
                            this.vx += (dx/d)*f; this.vy += (dy/d)*f;
                        }
                    }
                }
                this.x += this.vx * CONFIG.timeScale;
                this.y += this.vy * CONFIG.timeScale;
            }
            if (this.flash > 0) this.flash -= 0.05;
        }
        draw(ctx) {
            const glowR = this.radius * (4 + this.flash * 3);
            const grad = ctx.createRadialGradient(this.x, this.y, this.radius*0.5, this.x, this.y, glowR);
            grad.addColorStop(0, rgba(255,255,255, ${0.9 + this.flash}));
            grad.addColorStop(0.2, this.fixed ? 'rgba(0, 198, 255, 0.4)' : 'rgba(255,100,50,0.4)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(this.x, this.y, glowR, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
            
            ctx.strokeStyle = rgba(255,255,255, ${0.5 + this.flash});
            ctx.lineWidth = 1.5; ctx.stroke();
        }
    }

    class Shockwave {
        constructor(x, y) {
            this.x = x; this.y = y; this.r = 1; this.alpha = 1;
        }
        update() { this.r += 5 * CONFIG.timeScale; this.alpha -= 0.05 * CONFIG.timeScale; }
        draw(ctx) {
            ctx.strokeStyle = rgba(255, 255, 255, ${this.alpha});
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
        }
    }

    // --- HELPERS ---

    function createExplosion(x, y, hue, vx, vy, shock) {
        const count = Math.floor(Math.random() * 5) + 4;
        for(let i=0; i<count; i++) {
            debris.push({
                x: x, y: y,
                vx: vx * 0.6 + (Math.random()-0.5)*5,
                vy: vy * 0.6 + (Math.random()-0.5)*5,
                hue: hue,
                life: 1.0,
                decay: Math.random() * 0.03 + 0.01,
                draw: function(ctx) {
                    ctx.fillStyle = hsla(${this.hue}, 100%, 70%, ${this.life});
                    ctx.fillRect(this.x, this.y, 3, 3);
                },
                update: function() {
                    this.x += this.vx * CONFIG.timeScale;
                    this.y += this.vy * CONFIG.timeScale;
                    this.life -= this.decay * CONFIG.timeScale;
                }
            });
        }
        if(shock) debris.push(new Shockwave(x, y));
    }

    function initBackground() {
        nebulaClouds = [];
        const colors = ['rgba(0, 30, 80, 0.15)', 'rgba(60, 0, 80, 0.12)', 'rgba(0, 80, 80, 0.1)'];
        for(let i=0; i<12; i++) {
            nebulaClouds.push({
                x: (Math.random()-0.5)*width*3, y: (Math.random()-0.5)*height*3,
                r: Math.random()*400+200, c: colors[Math.floor(Math.random()*colors.length)]
            });
        }
        bgStars = [];
        for(let i=0; i<600; i++) {
            bgStars.push({
                x: (Math.random()-0.5)*width*4, y: (Math.random()-0.5)*height*4,
                size: Math.random()*1.5, alpha: Math.random()*0.6+0.2
            });
        }
    }

    function drawBackground() {
        bgCtx.fillStyle = '#010102';
        bgCtx.fillRect(0, 0, width, height);
        bgCtx.save();
        bgCtx.translate(width/2 + camera.x*0.1, height/2 + camera.y*0.1); // Parallax
        
        // Nebula
        bgCtx.globalCompositeOperation = 'screen';
        for (let n of nebulaClouds) {
            const g = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.c); g.addColorStop(1, 'rgba(0,0,0,0)');
            bgCtx.fillStyle = g; bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r, 0, Math.PI*2); bgCtx.fill();
        }
        bgCtx.globalCompositeOperation = 'source-over';
        
        // Stars
        bgCtx.fillStyle = 'white';
        for(let s of bgStars) {
            bgCtx.globalAlpha = s.alpha;
            bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.size, 0, Math.PI*2); bgCtx.fill();
        }
        bgCtx.restore();
    }

    function drawHUD(ctx, star) {
        const sx = star.x;
        const sy = star.y;
        const lineLen = 60;
        
        ctx.strokeStyle = '#00c6ff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx + 20, sy - 20);
        ctx.lineTo(sx + lineLen, sy - 50);
        ctx.lineTo(sx + lineLen + 120, sy - 50);
        ctx.stroke();

        ctx.fillStyle = 'rgba(0, 20, 40, 0.8)';
        ctx.fillRect(sx + lineLen, sy - 80, 120, 30);
        
        ctx.fillStyle = '#00c6ff';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(star.type, sx + lineLen + 5, sy - 60);
        
        ctx.font = '10px monospace';
        ctx.fillStyle = '#ccc';
        ctx.fillText(Temp: ${star.temp}, sx + lineLen + 5, sy - 35);
        ctx.fillText(Planets: ${star.planets.length}, sx + lineLen + 5, sy - 20);
        
        // Target Reticle
        ctx.strokeStyle = 'rgba(0, 198, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, 25, 0, Math.PI*2);
        ctx.stroke();
    }

    // --- SCENARIOS ---
    function resetSim() {
        const type = document.getElementById('scenario-select').value;
        stars = []; debris = []; gravityBodies = []; camera.following = null;
        camera.x = 0; camera.y = 0; camera.targetZoom = 0.7;
        
        initBackground();

        if (type === 'galaxy') {
            gravityBodies.push(new GravityBody(0, 0, 3000, true));
            createGalaxy(0, 0, CONFIG.count, 3000);
        } else if (type === 'collision') {
            gravityBodies.push(new GravityBody(-500, 0, 1800)); gravityBodies.push(new GravityBody(500, 0, 1800));
            gravityBodies[0].vx = 1.5; gravityBodies[1].vx = -1.5;
            createGalaxy(-500, 0, CONFIG.count/2, 1800, 0, 1.5); createGalaxy(500, 0, CONFIG.count/2, 1800, 0, -1.5);
        } else if (type === 'binary') {
            const d = 300, m = 2000, v = Math.sqrt(CONFIG.G*m/(2*d))*1.8;
            const b1 = new GravityBody(-d, 0, m); b1.vy = v;
            const b2 = new GravityBody(d, 0, m); b2.vy = -v;
            gravityBodies.push(b1, b2);
            createGalaxy(0, 0, CONFIG.count, m*2, 0, 0, 700);
        } else if (type === 'nebula_cluster') {
            for(let i=0; i<5; i++) {
                const cx = (Math.random()-0.5)*1500, cy = (Math.random()-0.5)*1500, m = Math.random()*500+500;
                gravityBodies.push(new GravityBody(cx, cy, m));
                createGalaxy(cx, cy, CONFIG.count/5, m, 0, 0, 200);
            }
        } else if (type === 'random') {
            gravityBodies.push(new GravityBody(0, 0, 2500, true));
            for(let i=0; i<CONFIG.count; i++) stars.push(new Star((Math.random()-0.5)*width*2.5, (Math.random()-0.5)*height*2.5, (Math.random()-0.5)*3, (Math.random()-0.5)*3, Math.random()*2+0.1));
        } else if (type === 'bigbang') {
             for(let i=0; i<CONFIG.count; i++) {
                const a = Math.random()*Math.PI*2, r=Math.random()*20, v=Math.random()*25+5;
                stars.push(new Star(Math.cos(a)*r, Math.sin(a)*r, Math.cos(a)*v, Math.sin(a)*v, Math.random()*2+0.5));
            }
        }
        showNotif(Scenario: ${type.toUpperCase()});
    }

    function createGalaxy(cx, cy, count, cmass, hueS=0, ovx=0, spread=600) {
        const arms = Math.floor(Math.random()*3)+2;
        for(let i=0; i<count; i++) {
            const dist = Math.random()*spread+60;
            const ang = dist*0.004 + (i%arms)*((Math.PI*2)/arms) + (Math.random()*0.5-0.25);
            const x = cx + Math.cos(ang)*dist, y = cy + Math.sin(ang)*dist;
            const v = Math.sqrt((CONFIG.G*cmass)/dist);
            stars.push(new Star(x, y, ovx - Math.sin(ang)*v, Math.cos(ang)*v, (1-(dist/spread))*2+0.2));
        }
    }

    // --- MAIN LOOP ---
    function animate() {
        if (isPaused) { animationId = requestAnimationFrame(animate); return; }

        // Auto Tour
        if (autoTourActive) {
            autoTourTimer++;
            if (autoTourTimer > 300) {
                autoTourTimer = 0;
                if (Math.random()>0.3 && gravityBodies.length>0) {
                    camera.following = gravityBodies[Math.floor(Math.random()*gravityBodies.length)];
                    showNotif("Tracking: Black Hole");
                } else if (stars.length>0) {
                    const s = stars[Math.floor(Math.random()*stars.length)];
                    if(!s.dead) { camera.following = s; showNotif("Tracking: Star System"); }
                }
            }
        }

        // Camera Follow
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
        if (camera.following) {
            if(camera.following.dead) camera.following = null;
            else { camera.x += (-camera.following.x - camera.x)*0.05; camera.y += (-camera.following.y - camera.y)*0.05; }
        }

        drawBackground();
        
        // Trails
        ctx.fillStyle = rgba(1, 1, 2, ${CONFIG.trail});
        ctx.fillRect(0, 0, width, height);
        
        ctx.save();
        ctx.translate(width/2 + camera.x, height/2 + camera.y);
        ctx.scale(camera.zoom, camera.zoom);

        // Render Entities
        ctx.globalCompositeOperation = 'lighter';
        
        // Bodies
        gravityBodies.forEach(b => { b.update(); b.draw(ctx); });
        
        // Stars
        for (let i = stars.length - 1; i >= 0; i--) {
            const s = stars[i]; s.update();
            if (s.dead) stars.splice(i, 1); else s.draw(ctx, camera.zoom);
        }

        // Debris / Meteors
        for (let i = debris.length - 1; i >= 0; i--) {
            const d = debris[i]; 
            if(d.update) d.update(); else d.life -= 0.01; // Fallback
            if(d.draw) d.draw(ctx);
            
            if ((d.life !== undefined && d.life <= 0) || (d.alpha !== undefined && d.alpha <= 0)) debris.splice(i, 1);
        }

        // Meteor Tool Emission
        if (CONFIG.mode === 'meteor' && mouse.down) {
            const wx = (mouse.screenX - width/2 - camera.x) / camera.zoom;
            const wy = (mouse.screenY - height/2 - camera.y) / camera.zoom;
            // Shoot towards center or just random direction? Let's shoot in random spray
            for(let k=0; k<2; k++) {
                debris.push(new Meteor(wx, wy, Math.random() * Math.PI * 2));
            }
        }

        // HUD Drawing (Last so it's on top in the scene context)
        if (camera.following && camera.following instanceof Star) {
            drawHUD(ctx, camera.following);
        }

        ctx.restore();
        animationId = requestAnimationFrame(animate);
    }

    // --- EVENTS ---
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; bgCanvas.width = width; bgCanvas.height = height; initBackground(); }
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousedown', e => {
        mouse.down = true; mouse.screenX = e.clientX; mouse.screenY = e.clientY;
        if (e.button === 2 || (e.button === 0 && CONFIG.mode === 'view')) {
            camera.dragging = true; camera.lastX = e.clientX; camera.lastY = e.clientY;
            camera.following = null; autoTourActive = false;
            document.getElementById('btn-tour').innerText = "🎬 Auto Tour: OFF";
            canvas.style.cursor = 'grabbing';
        } else if (e.button === 0 && CONFIG.mode === 'create') {
            const wx = (e.clientX - width/2 - camera.x) / camera.zoom;
            const wy = (e.clientY - height/2 - camera.y) / camera.zoom;
            gravityBodies.push(new GravityBody(wx, wy, 2000)); showNotif("Black Hole Created");
        }
    });
    
    window.addEventListener('mousemove', e => {
        mouse.screenX = e.clientX; mouse.screenY = e.clientY;
        if (camera.dragging) {
            camera.x += e.clientX - camera.lastX; camera.y += e.clientY - camera.lastY;
            camera.lastX = e.clientX; camera.lastY = e.clientY;
        }
    });
    
    window.addEventListener('mouseup', () => { mouse.down = false; camera.dragging = false; canvas.style.cursor = 'crosshair'; });
    
    canvas.addEventListener('dblclick', e => {
        const wx = (e.clientX - width/2 - camera.x) / camera.zoom;
        const wy = (e.clientY - height/2 - camera.y) / camera.zoom;
        let closest = null, minDist = 60 / camera.zoom;
        for(let s of stars) { const d = Math.hypot(s.x-wx, s.y-wy); if(d<minDist) { minDist=d; closest=s; } }
        if (closest) { camera.following = closest; showNotif("Target Locked"); }
    });

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const f = Math.exp(-e.deltaY * 0.001);
        camera.targetZoom *= f;
        if (camera.targetZoom < 0.1) camera.targetZoom = 0.1; if (camera.targetZoom > 10) camera.targetZoom = 10;
    }, { passive: false });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // UI Actions
    window.setMode = m => { 
        CONFIG.mode = m; 
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode-${m}).classList.add('active');
        showNotif(Tool: ${m.toUpperCase()});
    };
    window.togglePause = () => { isPaused = !isPaused; document.getElementById('btn-pause').innerText = isPaused ? "▶ Resume" : "⏸ Pause"; if(!isPaused) animate(); };
    window.toggleAutoTour = () => {
        autoTourActive = !autoTourActive;
        document.getElementById('btn-tour').innerText = autoTourActive ? "🎬 Auto Tour: ON" : "🎬 Auto Tour: OFF";
        if(!autoTourActive) camera.following = null;
    };
    window.takeScreenshot = () => {
        const t = document.createElement('canvas'); t.width=width; t.height=height; const tx=t.getContext('2d');
        tx.drawImage(bgCanvas,0,0); tx.drawImage(canvas,0,0);
        const l = document.createElement('a'); l.download='cosmos_v5.png'; l.href=t.toDataURL(); l.click();
        showNotif("Screenshot Saved");
    };
    window.resetSim = resetSim;
    
    function showNotif(txt) {
        const el = document.getElementById('notification'); el.innerText = txt; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }

    document.getElementById('scenario-select').addEventListener('change', resetSim);
    document.getElementById('star-count').addEventListener('input', e => { document.getElementById('count-val').innerText = e.target.value; CONFIG.count = parseInt(e.target.value); });
    document.getElementById('time-scale').addEventListener('input', e => { CONFIG.timeScale = parseFloat(e.target.value); document.getElementById('time-val').innerText = CONFIG.timeScale.toFixed(1) + 'x'; });
    document.getElementById('gravity-strength').addEventListener('input', e => { CONFIG.G = parseFloat(e.target.value); document.getElementById('grav-val').innerText = CONFIG.G; });
    document.getElementById('trail-length').addEventListener('input', e => CONFIG.trail = parseFloat(e.target.value));

    resize(); resetSim(); animate();

</script>
</body>
</html>
