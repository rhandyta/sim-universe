<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Alam Semesta V8: Expansion</title>
    <style>
        /* --- Reset & Base --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010102;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            user-select: none;
        }

        /* --- Canvas Layers --- */
        .canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #bgCanvas { z-index: 0; }
        #simCanvas { z-index: 1; cursor: crosshair; }

        /* --- UI Toggle Button --- */
        #ui-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 198, 255, 0.2);
            border: 1px solid #00c6ff;
            border-radius: 8px;
            color: #00c6ff;
            font-size: 20px;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        #ui-toggle:hover { background: rgba(0, 198, 255, 0.4); box-shadow: 0 0 15px #00c6ff; }

        /* --- UI Panel --- */
        #ui-panel {
            position: absolute;
            top: 70px; /* Below toggle button */
            left: 20px;
            width: 350px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            background: rgba(8, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            z-index: 100;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            scrollbar-width: thin;
            scrollbar-color: #00c6ff #111;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
            transform-origin: top left;
        }
        
        #ui-panel.closed {
            transform: translateX(-400px) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }
        
        /* Typography */
        h1 {
            font-size: 20px;
            margin: 0 0 15px 0;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .section-header {
            font-size: 10px;
            color: #5e80a3;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 15px 0 8px 0;
            font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }

        /* Inputs */
        .control-group { margin-bottom: 10px; }
        label { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00c6ff; height: 4px; background: #333; border-radius: 2px; appearance: none; }
        
        select {
            width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: white; border-radius: 6px;
            font-size: 12px; outline: none; cursor: pointer;
        }

        /* Mode Toggles */
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .mode-btn {
            padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px;
            text-align: center; font-size: 10px; cursor: pointer; transition: 0.2s; color: #888; display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.1); }
        .mode-btn.active {
            background: rgba(0, 198, 255, 0.15); color: #00c6ff; border-color: rgba(0, 198, 255, 0.5); font-weight: bold;
        }
        .mode-icon { font-size: 14px; margin-bottom: 3px; }

        /* Checkbox toggle */
        .toggle-row { display: flex; align-items: center; font-size: 12px; color: #ccc; margin-bottom: 8px; cursor: pointer;}
        .toggle-row input { margin-right: 8px; accent-color: #00c6ff; cursor: pointer; }

        /* Action Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
        button {
            padding: 10px; border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-normal { background: #222; color: #ddd; border: 1px solid #444; }
        .btn-normal:hover { background: #333; border-color: #666; }
        
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff); color: #000; grid-column: span 2;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); }

        .btn-tour {
             background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; grid-column: span 2;
        }
        
        .btn-reverse {
            background: linear-gradient(135deg, #f857a6, #ff5858); color: white; grid-column: span 2;
        }
        .btn-reverse:hover { filter: brightness(1.2); }

        /* HUD & Notification */
        #fps-counter {
            position: absolute; top: 20px; right: 20px; font-family: monospace; color: #00c6ff;
            font-size: 12px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px;
        }

        #notification {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.8); border: 1px solid #00c6ff; color: #00c6ff;
            padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: bold;
            opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 200;
        }
        #notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .key-hint { font-size: 10px; color: #666; text-align: center; margin-top: 15px; line-height: 1.4; font-style: italic; }
    </style>
</head>
<body>

    <!-- Toggle Button -->
    <div id="ui-toggle" onclick="toggleUI()">☰</div>
    
    <div id="fps-counter">FPS: 60</div>
    <div id="notification">Notification</div>
    
    <canvas id="bgCanvas" class="canvas-layer"></canvas>
    <canvas id="simCanvas" class="canvas-layer"></canvas>

    <div id="ui-panel">
        <h1>COSMOS V8: EXPANSION</h1>
        
        <div class="section-header">Skenario</div>
        <select id="scenario-select">
            <option value="galaxy">Galaksi Spiral</option>
            <option value="collision">Tabrakan Galaksi</option>
            <option value="binary">Sistem Bintang Ganda</option>
            <option value="nebula_cluster">Gugus Bintang</option>
            <option value="random">Chaos Field</option>
            <option value="bigbang">The Big Bang (Interaktif)</option>
        </select>

        <div class="section-header">Peralatan Dewa</div>
        <div class="mode-grid">
            <div class="mode-btn active" onclick="setMode('view')" id="mode-view"><span class="mode-icon">📷</span>View</div>
            <div class="mode-btn" onclick="setMode('create')" id="mode-create"><span class="mode-icon">⚫</span>Hole</div>
            <div class="mode-btn" onclick="setMode('wormhole')" id="mode-wormhole"><span class="mode-icon">🌀</span>Portal</div>
            <div class="mode-btn" onclick="setMode('meteor')" id="mode-meteor"><span class="mode-icon">☄️</span>Meteor</div>
            <div class="mode-btn" onclick="setMode('repulse')" id="mode-repulse"><span class="mode-icon">💥</span>Blast</div>
            <div class="mode-btn" onclick="setMode('nebula')" id="mode-nebula"><span class="mode-icon">🎨</span>Nebula</div>
        </div>

        <div class="section-header">Fitur Visual & Fisika</div>
        <label class="toggle-row">
            <input type="checkbox" id="toggle-constellation" onchange="toggleConstellations(this.checked)"> Jaring Rasi Bintang (Web)
        </label>
        <label class="toggle-row">
            <input type="checkbox" id="toggle-habitable" onchange="CONFIG.showHabitable = this.checked"> Zona Layak Huni
        </label>
         <label class="toggle-row">
            <input type="checkbox" id="toggle-mutual" onchange="CONFIG.mutualGravity = this.checked"> Mutual Gravity (Berat!)
        </label>
        
        <div class="control-group">
            <label>Tema Warna:</label>
            <select id="theme-select" onchange="setTheme(this.value)">
                <option value="neon">Neon Cosmic (Default)</option>
                <option value="realistic">Realistic</option>
                <option value="inferno">Inferno</option>
            </select>
        </div>

        <div class="control-group">
            <label>Kecepatan Waktu: <span id="time-val">1.0x</span></label>
            <input type="range" id="time-scale" min="0.0" max="3.0" value="1.0" step="0.1">
        </div>
        <div class="control-group">
            <label>Gravitasi: <span id="grav-val">0.6</span></label>
            <input type="range" id="gravity-strength" min="0.1" max="3.0" value="0.6" step="0.1">
        </div>
        <div class="control-group">
            <label>Jumlah Partikel: <span id="count-val">2000</span></label>
            <input type="range" id="star-count" min="500" max="4000" value="2000" step="100">
        </div>
        
        <div class="btn-grid">
            <button class="btn-normal" onclick="resetSim()">Reset</button>
            <button class="btn-normal" onclick="takeScreenshot()">📸 Foto</button>
            <button class="btn-tour" onclick="toggleAutoTour()" id="btn-tour">🎬 Auto Tour</button>
            <button class="btn-primary" onclick="togglePause()" id="btn-pause">Pause / Play</button>
            <button class="btn-reverse" onclick="reverseTime()">⏪ Balikkan Waktu</button>
        </div>
        
        <div class="key-hint">
            Big Bang Mode: Bintang akan saling menarik (Mutual Gravity) menciptakan kluster galaksi alami.
        </div>
    </div>

<script>
    // --- ENGINE CORE ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    let width, height;
    let animationId;
    let isPaused = false;
    
    // Entities
    let stars = [];
    let debris = [];
    let gravityBodies = [];
    let wormholes = [];
    let bgStars = [];
    let nebulaClouds = [];
    let drawnNebulas = [];
    let quasarParticles = [];
    let constellationLinks = []; 

    // Camera & Interaction
    const camera = { x: 0, y: 0, zoom: 0.7, targetZoom: 0.7, dragging: false, lastX: 0, lastY: 0, following: null };
    const mouse = { x: 0, y: 0, screenX: 0, screenY: 0, down: false };
    let autoTourActive = false;
    let autoTourTimer = 0;
    let wormholeStart = null;
    let uiVisible = true;

    // Settings
    const CONFIG = {
        count: 2000,
        G: 0.6,
        softening: 10,
        friction: 0.992,
        trail: 0.25,
        timeScale: 1.0,
        mode: 'view',
        showHabitable: false,
        showConstellations: false,
        mutualGravity: false, // New: Star-to-star gravity
        theme: 'neon'
    };
    
    const THEMES = {
        neon: { bg: '#010102', trail: 'rgba(1, 1, 2, 0.25)', starSat: '90%', starLight: '70%' },
        realistic: { bg: '#000000', trail: 'rgba(0, 0, 0, 0.2)', starSat: '30%', starLight: '90%' },
        inferno: { bg: '#0a0000', trail: 'rgba(20, 0, 0, 0.25)', starSat: '100%', starLight: '60%' }
    };

    // --- CLASSES ---

    class Wormhole {
        constructor(x1, y1, x2, y2) {
            this.in = { x: x1, y: y1, color: '#00c6ff' };
            this.out = { x: x2, y: y2, color: '#ff9933' };
            this.radius = 40; this.spin = 0;
        }
        check(entity) {
            let dx = entity.x - this.in.x; let dy = entity.y - this.in.y;
            if (dx*dx + dy*dy < this.radius*this.radius) {
                entity.x = this.out.x + (Math.random()-0.5)*10; entity.y = this.out.y + (Math.random()-0.5)*10;
                createExplosion(this.out.x, this.out.y, 200, entity.vx, entity.vy, false); return true;
            }
            dx = entity.x - this.out.x; dy = entity.y - this.out.y;
            if (dx*dx + dy*dy < this.radius*this.radius) {
                entity.x = this.in.x + (Math.random()-0.5)*10; entity.y = this.in.y + (Math.random()-0.5)*10;
                createExplosion(this.in.x, this.in.y, 30, entity.vx, entity.vy, false); return true;
            }
            return false;
        }
        update() { this.spin += 0.05 * CONFIG.timeScale; }
        draw(ctx) {
            this.drawGate(ctx, this.in.x, this.in.y, this.in.color);
            this.drawGate(ctx, this.out.x, this.out.y, this.out.color);
            if (camera.zoom < 0.5) {
                ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.setLineDash([5, 15]);
                ctx.beginPath(); ctx.moveTo(this.in.x, this.in.y); ctx.lineTo(this.out.x, this.out.y); ctx.stroke(); ctx.setLineDash([]);
            }
        }
        drawGate(ctx, x, y, color) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(this.spin);
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
            for(let i=0; i<4; i++) { ctx.rotate(Math.PI/2); ctx.moveTo(10, 0); ctx.quadraticCurveTo(20, 20, 0, 40); }
            ctx.stroke();
            const grad = ctx.createRadialGradient(0,0,5, 0,0,40);
            grad.addColorStop(0, 'white'); grad.addColorStop(0.5, color); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0,0,40,0,Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    class Star {
        constructor(x, y, vx, vy, mass) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.mass = mass;
            this.size = Math.random() * 1.5 + 0.5;
            this.dead = false;
            this.classify();
            
            // Planets
            this.planets = [];
            if (Math.random() > 0.3 && mass > 0.5) {
                const numPlanets = Math.floor(Math.random() * 5);
                for(let i=0; i<numPlanets; i++) {
                    const dist = (this.size * 6) + (i * 8) + Math.random()*5;
                    const idealDist = mass * 20 + 20;
                    const isHabitable = Math.abs(dist - idealDist) < 15;
                    this.planets.push({
                        dist: dist, angle: Math.random() * Math.PI * 2,
                        speed: (Math.random() * 0.04 + 0.01) * (Math.random() > 0.5 ? 1 : -1),
                        size: Math.random() * 0.9 + 0.4,
                        color: isHabitable ? '#00ffaa' : `hsl(${Math.random()*360}, 60%, 50%)`,
                        habitable: isHabitable
                    });
                }
            }
            // Asteroid Belt
            this.hasBelt = Math.random() > 0.7 && mass > 0.8;
            this.beltDist = this.size * 30 + Math.random() * 20;
            this.beltRot = Math.random() * Math.PI;
        }

        classify() {
            const t = THEMES[CONFIG.theme];
            if (this.mass > 2.0) {
                this.type = "O-Type (Blue Giant)"; this.hue = 210 + Math.random()*30; 
                this.temp = "30,000 K"; this.color = `hsl(${this.hue}, ${t.starSat}, ${t.starLight})`; this.habitableZone = this.mass * 25;
            } else if (this.mass > 1.0) {
                this.type = "G-Type (Sun-like)"; this.hue = 50 + Math.random()*20; 
                this.temp = "5,800 K"; this.color = `hsl(${this.hue}, ${t.starSat}, ${t.starLight})`; this.habitableZone = this.mass * 20 + 20;
            } else {
                this.type = "M-Type (Red Dwarf)"; this.hue = 10 + Math.random()*30; 
                this.temp = "3,000 K"; this.color = `hsl(${this.hue}, ${t.starSat}, 65%)`; this.habitableZone = this.mass * 15 + 10;
            }
        }

        update() {
            if (this.dead) return;
            let fx = 0, fy = 0;
            let closestBody = null; let closestDist = Infinity;

            // 1. Gravity Bodies (Black Holes)
            for (let b of gravityBodies) {
                const dx = b.x - this.x; const dy = b.y - this.y;
                const distSq = dx*dx + dy*dy; const dist = Math.sqrt(distSq);
                if (dist < closestDist) { closestDist = dist; closestBody = b; }
                if (dist > 5) { 
                    const f = (CONFIG.G * b.mass) / (distSq + CONFIG.softening);
                    fx += (dx / dist) * f; fy += (dy / dist) * f;
                }
            }
            
            // 2. Mutual Gravity (Star-to-Star) - Stochastic Approach (O(N) approximation)
            // Only active if toggled OR specific scenario
            if (CONFIG.mutualGravity) {
                // Check 4 random neighbors instead of all (Optimization)
                for(let k=0; k<4; k++) {
                    const other = stars[Math.floor(Math.random() * stars.length)];
                    if (other !== this && !other.dead) {
                        const dx = other.x - this.x;
                        const dy = other.y - this.y;
                        const distSq = dx*dx + dy*dy;
                        if (distSq > 10 && distSq < 100000) { // Range limit
                             const dist = Math.sqrt(distSq);
                             // Reduced G for star-star to prevent instant collapse
                             const f = (CONFIG.G * 0.2 * other.mass) / (distSq + 20); 
                             fx += (dx/dist) * f;
                             fy += (dy/dist) * f;
                        }
                    }
                }
            }

            for (let w of wormholes) if (w.check(this)) break;

            if (mouse.down && CONFIG.mode === 'repulse') {
                const wx = (mouse.screenX - width/2 - camera.x) / camera.zoom;
                const wy = (mouse.screenY - height/2 - camera.y) / camera.zoom;
                const dx = wx - this.x; const dy = wy - this.y; const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 250) {
                    const force = -800 / (dist + 10); fx += (dx/dist) * force; fy += (dy/dist) * force;
                }
            }

            if (closestBody && closestDist < closestBody.radius * 0.6) {
                this.dead = true;
                createExplosion(this.x, this.y, this.hue, this.vx, this.vy, true);
                closestBody.flash = 1.0; return;
            }

            this.vx += fx * CONFIG.timeScale; this.vy += fy * CONFIG.timeScale;
            this.vx *= CONFIG.friction; this.vy *= CONFIG.friction;
            this.x += this.vx * CONFIG.timeScale; this.y += this.vy * CONFIG.timeScale;
            
            for(let p of this.planets) p.angle += p.speed * CONFIG.timeScale;
            if (this.hasBelt) this.beltRot += 0.005 * CONFIG.timeScale;
        }

        draw(ctx, zoom) {
            if (this.dead) return;

            if (CONFIG.showHabitable && zoom > 1.0) {
                ctx.strokeStyle = 'rgba(46, 204, 113, 0.15)'; ctx.lineWidth = 10;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.habitableZone, 0, Math.PI*2); ctx.stroke();
            }

            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();

            if (zoom > 1.5) {
                if (this.planets.length > 0) {
                    for(let p of this.planets) {
                        const px = this.x + Math.cos(p.angle) * p.dist;
                        const py = this.y + Math.sin(p.angle) * p.dist;
                        if (zoom > 2.5) { ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(this.x, this.y, p.dist, 0, Math.PI*2); ctx.stroke(); }
                        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI*2); ctx.fill();
                    }
                }
                if (this.hasBelt && zoom > 1.8) {
                    ctx.fillStyle = 'rgba(150, 150, 150, 0.3)';
                    for(let i=0; i<15; i++) {
                        const a = this.beltRot + (i * (Math.PI*2)/15);
                        const ax = this.x + Math.cos(a) * this.beltDist;
                        const ay = this.y + Math.sin(a) * this.beltDist;
                        ctx.fillRect(ax, ay, 1.5, 1.5);
                    }
                }
            }
        }
    }

    class GravityBody {
        constructor(x, y, mass, fixed = false) {
            this.x = x; this.y = y; this.mass = mass; this.fixed = fixed;
            this.vx = 0; this.vy = 0;
            this.radius = Math.sqrt(mass) / 1.8;
            this.flash = 0; this.jetTimer = 0;
        }
        update() {
            if (!this.fixed) {
                for (let other of gravityBodies) {
                    if (other !== this) {
                        const dx = other.x - this.x; const dy = other.y - this.y;
                        const d = Math.sqrt(dx*dx + dy*dy);
                        if (d > this.radius + other.radius) {
                            const f = (CONFIG.G * 0.15 * other.mass) / (d*d);
                            this.vx += (dx/d)*f; this.vy += (dy/d)*f;
                        }
                    }
                }
                this.x += this.vx * CONFIG.timeScale; this.y += this.vy * CONFIG.timeScale;
            }
            if (this.flash > 0) this.flash -= 0.05;
            
            if (this.mass > 2500) {
                this.jetTimer++;
                if (this.jetTimer % 2 === 0) {
                    const speed = 10 + Math.random() * 5;
                    quasarParticles.push({
                        x: this.x, y: this.y, vx: (Math.random()-0.5), vy: -speed,
                        life: 1.0, color: '#00c6ff', size: Math.random()*3
                    });
                    quasarParticles.push({
                        x: this.x, y: this.y, vx: (Math.random()-0.5), vy: speed,
                        life: 1.0, color: '#ff0066', size: Math.random()*3
                    });
                }
            }
        }
        draw(ctx) {
            const glowR = this.radius * (4 + this.flash * 3);
            const grad = ctx.createRadialGradient(this.x, this.y, this.radius*0.5, this.x, this.y, glowR);
            grad.addColorStop(0, `rgba(255,255,255, ${0.9 + this.flash})`);
            grad.addColorStop(0.2, this.fixed ? 'rgba(0, 198, 255, 0.4)' : 'rgba(255,100,50,0.4)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, glowR, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255, ${0.5 + this.flash})`; ctx.lineWidth = 1.5; ctx.stroke();
        }
    }

    class Shockwave {
        constructor(x, y) { this.x = x; this.y = y; this.r = 1; this.alpha = 1; }
        update() { this.r += 5 * CONFIG.timeScale; this.alpha -= 0.05 * CONFIG.timeScale; }
        draw(ctx) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
        }
    }

    // --- HELPERS ---

    function createExplosion(x, y, hue, vx, vy, shock) {
        const count = Math.floor(Math.random() * 5) + 4;
        for(let i=0; i<count; i++) {
            debris.push({
                x: x, y: y, vx: vx * 0.6 + (Math.random()-0.5)*5, vy: vy * 0.6 + (Math.random()-0.5)*5,
                hue: hue, life: 1.0, decay: Math.random() * 0.03 + 0.01,
                draw: function(ctx) { ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life})`; ctx.fillRect(this.x, this.y, 3, 3); },
                update: function() { this.x += this.vx * CONFIG.timeScale; this.y += this.vy * CONFIG.timeScale; this.life -= this.decay * CONFIG.timeScale; }
            });
        }
        if(shock) debris.push(new Shockwave(x, y));
    }

    function generateConstellations() {
        const links = []; const maxDistSq = 150 * 150;
        const limit = Math.min(stars.length, 800);
        for (let i = 0; i < limit; i++) {
            let connected = 0;
            for (let j = i + 1; j < limit; j++) {
                if (connected > 2) break;
                const dx = stars[i].x - stars[j].x; const dy = stars[i].y - stars[j].y;
                if (dx*dx + dy*dy < maxDistSq) { links.push([i, j]); connected++; }
            }
        }
        return links;
    }

    function initBackground() {
        nebulaClouds = []; drawnNebulas = [];
        const colors = ['rgba(0, 30, 80, 0.15)', 'rgba(60, 0, 80, 0.12)', 'rgba(0, 80, 80, 0.1)'];
        for(let i=0; i<12; i++) {
            nebulaClouds.push({
                x: (Math.random()-0.5)*width*3, y: (Math.random()-0.5)*height*3,
                r: Math.random()*400+200, c: colors[Math.floor(Math.random()*colors.length)]
            });
        }
        bgStars = [];
        for(let i=0; i<800; i++) {
            bgStars.push({
                x: (Math.random()-0.5)*width*4, y: (Math.random()-0.5)*height*4,
                size: Math.random()*1.5, alpha: Math.random()*0.6+0.2
            });
        }
    }

    function drawBackground() {
        bgCtx.fillStyle = THEMES[CONFIG.theme].bg; bgCtx.fillRect(0, 0, width, height);
        bgCtx.save(); bgCtx.translate(width/2 + camera.x*0.1, height/2 + camera.y*0.1);
        
        bgCtx.globalCompositeOperation = 'screen';
        for (let n of nebulaClouds) {
            const g = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.c); g.addColorStop(1, 'rgba(0,0,0,0)');
            bgCtx.fillStyle = g; bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r, 0, Math.PI*2); bgCtx.fill();
        }
        for (let dn of drawnNebulas) {
             const g = bgCtx.createRadialGradient(dn.x, dn.y, 0, dn.x, dn.y, dn.r);
            g.addColorStop(0, dn.c); g.addColorStop(1, 'rgba(0,0,0,0)');
            bgCtx.fillStyle = g; bgCtx.beginPath(); bgCtx.arc(dn.x, dn.y, dn.r, 0, Math.PI*2); bgCtx.fill();
        }
        bgCtx.globalCompositeOperation = 'source-over';
        bgCtx.fillStyle = 'white';
        for(let s of bgStars) {
            bgCtx.globalAlpha = s.alpha; bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.size, 0, Math.PI*2); bgCtx.fill();
        }
        bgCtx.restore();
    }

    function drawHUD(ctx, star) {
        const sx = star.x; const sy = star.y; const lineLen = 60;
        ctx.strokeStyle = '#00c6ff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx + 20, sy - 20); ctx.lineTo(sx + lineLen, sy - 50); ctx.lineTo(sx + lineLen + 130, sy - 50); ctx.stroke();
        ctx.fillStyle = 'rgba(0, 20, 40, 0.8)'; ctx.fillRect(sx + lineLen, sy - 85, 130, 35);
        ctx.fillStyle = '#00c6ff'; ctx.font = 'bold 12px monospace'; ctx.fillText(star.type, sx + lineLen + 5, sy - 65);
        ctx.font = '10px monospace'; ctx.fillStyle = '#ccc'; ctx.fillText(`Temp: ${star.temp}`, sx + lineLen + 5, sy - 40);
        const habPlanets = star.planets.filter(p => p.habitable).length;
        ctx.fillStyle = habPlanets > 0 ? '#00ffaa' : '#ccc';
        ctx.fillText(`Planets: ${star.planets.length} (Life: ${habPlanets})`, sx + lineLen + 5, sy - 25);
        ctx.strokeStyle = 'rgba(0, 198, 255, 0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, 25, 0, Math.PI*2); ctx.stroke();
    }

    // --- SCENARIOS ---
    function resetSim() {
        const type = document.getElementById('scenario-select').value;
        stars = []; debris = []; gravityBodies = []; wormholes = []; quasarParticles = []; constellationLinks = [];
        camera.following = null; camera.x = 0; camera.y = 0; camera.targetZoom = 0.7; wormholeStart = null;
        
        initBackground();

        // Auto enable mutual gravity for Big Bang
        if (type === 'bigbang') {
            CONFIG.mutualGravity = true;
            document.getElementById('toggle-mutual').checked = true;
        } else {
            CONFIG.mutualGravity = false;
            document.getElementById('toggle-mutual').checked = false;
        }

        if (type === 'galaxy') {
            gravityBodies.push(new GravityBody(0, 0, 3000, true));
            createGalaxy(0, 0, CONFIG.count, 3000);
        } else if (type === 'collision') {
            gravityBodies.push(new GravityBody(-500, 0, 1800)); gravityBodies.push(new GravityBody(500, 0, 1800));
            gravityBodies[0].vx = 1.5; gravityBodies[1].vx = -1.5;
            createGalaxy(-500, 0, CONFIG.count/2, 1800, 0, 1.5); createGalaxy(500, 0, CONFIG.count/2, 1800, 0, -1.5);
        } else if (type === 'binary') {
            const d = 300, m = 2000, v = Math.sqrt(CONFIG.G*m/(2*d))*1.8;
            const b1 = new GravityBody(-d, 0, m); b1.vy = v;
            const b2 = new GravityBody(d, 0, m); b2.vy = -v;
            gravityBodies.push(b1, b2);
            createGalaxy(0, 0, CONFIG.count, m*2, 0, 0, 700);
        } else if (type === 'nebula_cluster') {
            for(let i=0; i<5; i++) {
                const cx = (Math.random()-0.5)*1500, cy = (Math.random()-0.5)*1500, m = Math.random()*500+500;
                gravityBodies.push(new GravityBody(cx, cy, m));
                createGalaxy(cx, cy, CONFIG.count/5, m, 0, 0, 200);
            }
        } else if (type === 'random') {
            gravityBodies.push(new GravityBody(0, 0, 2500, true));
            for(let i=0; i<CONFIG.count; i++) stars.push(new Star((Math.random()-0.5)*width*2.5, (Math.random()-0.5)*height*2.5, (Math.random()-0.5)*3, (Math.random()-0.5)*3, Math.random()*2+0.1));
        } else if (type === 'bigbang') {
             for(let i=0; i<CONFIG.count; i++) {
                const a = Math.random()*Math.PI*2, r=Math.random()*20, v=Math.random()*25+5;
                stars.push(new Star(Math.cos(a)*r, Math.sin(a)*r, Math.cos(a)*v, Math.sin(a)*v, Math.random()*2+0.5));
            }
        }
        
        constellationLinks = generateConstellations();
        showNotif(`Scenario: ${type.toUpperCase()}`);
    }

    function createGalaxy(cx, cy, count, cmass, hueS=0, ovx=0, spread=600) {
        const arms = Math.floor(Math.random()*3)+2;
        for(let i=0; i<count; i++) {
            const dist = Math.random()*spread+60;
            const ang = dist*0.004 + (i%arms)*((Math.PI*2)/arms) + (Math.random()*0.5-0.25);
            const x = cx + Math.cos(ang)*dist, y = cy + Math.sin(ang)*dist;
            const v = Math.sqrt((CONFIG.G*cmass)/dist);
            stars.push(new Star(x, y, ovx - Math.sin(ang)*v, Math.cos(ang)*v, (1-(dist/spread))*2+0.2));
        }
    }

    // --- MAIN LOOP ---
    function animate() {
        if (isPaused) { animationId = requestAnimationFrame(animate); return; }

        if (autoTourActive) {
            autoTourTimer++;
            if (autoTourTimer > 300) {
                autoTourTimer = 0;
                if (Math.random()>0.3 && gravityBodies.length>0) {
                    camera.following = gravityBodies[Math.floor(Math.random()*gravityBodies.length)];
                    showNotif("Tour: Black Hole");
                } else if (stars.length>0) {
                    const s = stars[Math.floor(Math.random()*stars.length)];
                    if(!s.dead) { camera.following = s; showNotif("Tour: Star System"); }
                }
            }
        }

        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;
        if (camera.following) {
            if(camera.following.dead) camera.following = null;
            else { camera.x += (-camera.following.x - camera.x)*0.05; camera.y += (-camera.following.y - camera.y)*0.05; }
        }

        drawBackground();
        // Theme specific trail
        ctx.fillStyle = THEMES[CONFIG.theme].trail; 
        ctx.fillRect(0, 0, width, height);
        ctx.save(); ctx.translate(width/2 + camera.x, height/2 + camera.y); ctx.scale(camera.zoom, camera.zoom);

        ctx.globalCompositeOperation = 'lighter';
        
        for (let i = quasarParticles.length - 1; i >= 0; i--) {
            const q = quasarParticles[i];
            q.x += q.vx * CONFIG.timeScale; q.y += q.vy * CONFIG.timeScale; q.life -= 0.02;
            ctx.fillStyle = q.color; ctx.globalAlpha = q.life;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI*2); ctx.fill();
            if (q.life <= 0) quasarParticles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;

        if (CONFIG.showConstellations) {
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let pair of constellationLinks) {
                const s1 = stars[pair[0]]; const s2 = stars[pair[1]];
                if (s1 && s2 && !s1.dead && !s2.dead) {
                    ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y);
                }
            }
            ctx.stroke();
        }
        
        wormholes.forEach(w => { w.update(); w.draw(ctx); });
        gravityBodies.forEach(b => { b.update(); b.draw(ctx); });
        
        for (let i = stars.length - 1; i >= 0; i--) {
            const s = stars[i]; s.update();
            if (s.dead) stars.splice(i, 1); else s.draw(ctx, camera.zoom);
        }

        for (let i = debris.length - 1; i >= 0; i--) {
            const d = debris[i]; 
            if(d.update) d.update(); else d.life -= 0.01;
            if(d.draw) d.draw(ctx);
            if ((d.life !== undefined && d.life <= 0) || (d.alpha !== undefined && d.alpha <= 0)) debris.splice(i, 1);
        }

        const worldMouseX = (mouse.screenX - width/2 - camera.x) / camera.zoom;
        const worldMouseY = (mouse.screenY - height/2 - camera.y) / camera.zoom;

        if (CONFIG.mode === 'meteor' && mouse.down) {
            for(let k=0; k<2; k++) {
                debris.push({
                    x: worldMouseX, y: worldMouseY,
                    vx: Math.cos(Math.random()*Math.PI*2)*8, vy: Math.sin(Math.random()*Math.PI*2)*8,
                    life: 1.0, hue: 200,
                    update: function() { this.x+=this.vx; this.y+=this.vy; this.life-=0.01; },
                    draw: function(ctx) { ctx.strokeStyle=`hsla(200,100%,80%,${this.life})`; ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x-this.vx*2,this.y-this.vy*2); ctx.stroke(); }
                });
            }
        }

        if (CONFIG.mode === 'nebula' && mouse.down) {
             const hue = Math.random() > 0.5 ? 280 : 180;
             drawnNebulas.push({
                 x: worldMouseX - camera.x*0.1, y: worldMouseY - camera.y*0.1, 
                 r: Math.random()*50+30, c: `hsla(${hue}, 70%, 50%, 0.05)`
             });
             if(drawnNebulas.length > 100) drawnNebulas.shift();
        }
        
        if (CONFIG.mode === 'wormhole' && wormholeStart) {
             ctx.strokeStyle = '#ff9933'; ctx.setLineDash([5,5]);
             ctx.beginPath(); ctx.moveTo(wormholeStart.x, wormholeStart.y); ctx.lineTo(worldMouseX, worldMouseY); ctx.stroke(); ctx.setLineDash([]);
        }

        if (camera.following && camera.following instanceof Star) drawHUD(ctx, camera.following);

        ctx.restore();
        animationId = requestAnimationFrame(animate);
    }

    // --- EVENTS ---
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; bgCanvas.width = width; bgCanvas.height = height; initBackground(); }
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousedown', e => {
        mouse.down = true; mouse.screenX = e.clientX; mouse.screenY = e.clientY;
        
        if (e.button === 2 || (e.button === 0 && CONFIG.mode === 'view')) {
            camera.dragging = true; camera.lastX = e.clientX; camera.lastY = e.clientY;
            camera.following = null; autoTourActive = false;
            document.getElementById('btn-tour').innerText = "🎬 Auto Tour: OFF";
            canvas.style.cursor = 'grabbing';
            return;
        }

        const wx = (e.clientX - width/2 - camera.x) / camera.zoom;
        const wy = (e.clientY - height/2 - camera.y) / camera.zoom;

        if (e.button === 0) {
            if (CONFIG.mode === 'create') {
                gravityBodies.push(new GravityBody(wx, wy, 2000)); showNotif("Black Hole Created");
            } else if (CONFIG.mode === 'wormhole') {
                if (!wormholeStart) {
                    wormholeStart = {x: wx, y: wy}; showNotif("Gate A Placed. Click for Gate B.");
                } else {
                    wormholes.push(new Wormhole(wormholeStart.x, wormholeStart.y, wx, wy));
                    wormholeStart = null; showNotif("Wormhole Connected!");
                }
            }
        }
    });
    
    window.addEventListener('mousemove', e => {
        mouse.screenX = e.clientX; mouse.screenY = e.clientY;
        if (camera.dragging) {
            camera.x += e.clientX - camera.lastX; camera.y += e.clientY - camera.lastY;
            camera.lastX = e.clientX; camera.lastY = e.clientY;
        }
    });
    
    window.addEventListener('mouseup', () => { mouse.down = false; camera.dragging = false; canvas.style.cursor = 'crosshair'; });
    
    canvas.addEventListener('dblclick', e => {
        const wx = (e.clientX - width/2 - camera.x) / camera.zoom;
        const wy = (e.clientY - height/2 - camera.y) / camera.zoom;
        let closest = null, minDist = 60 / camera.zoom;
        for(let s of stars) { const d = Math.hypot(s.x-wx, s.y-wy); if(d<minDist) { minDist=d; closest=s; } }
        if (closest) { camera.following = closest; showNotif("Target Locked"); }
    });

    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const f = Math.exp(-e.deltaY * 0.001);
        camera.targetZoom *= f;
        if (camera.targetZoom < 0.1) camera.targetZoom = 0.1; if (camera.targetZoom > 10) camera.targetZoom = 10;
    }, { passive: false });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.setMode = m => { 
        CONFIG.mode = m; wormholeStart = null;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`mode-${m}`).classList.add('active');
        showNotif(`Tool: ${m.toUpperCase()}`);
    };
    window.togglePause = () => { isPaused = !isPaused; document.getElementById('btn-pause').innerText = isPaused ? "▶ Resume" : "⏸ Pause"; if(!isPaused) animate(); };
    window.toggleAutoTour = () => {
        autoTourActive = !autoTourActive;
        document.getElementById('btn-tour').innerText = autoTourActive ? "🎬 Auto Tour: ON" : "🎬 Auto Tour: OFF";
        if(!autoTourActive) camera.following = null;
    };
    window.takeScreenshot = () => {
        const t = document.createElement('canvas'); t.width=width; t.height=height; const tx=t.getContext('2d');
        tx.drawImage(bgCanvas,0,0); tx.drawImage(canvas,0,0);
        const l = document.createElement('a'); l.download='cosmos_v8.png'; l.href=t.toDataURL(); l.click();
        showNotif("Screenshot Saved");
    };
    window.resetSim = resetSim;
    window.toggleConstellations = (checked) => { CONFIG.showConstellations = checked; };
    
    // New Features V8
    window.toggleUI = () => {
        uiVisible = !uiVisible;
        const panel = document.getElementById('ui-panel');
        if(uiVisible) panel.classList.remove('closed');
        else panel.classList.add('closed');
    };
    
    window.reverseTime = () => {
        stars.forEach(s => { s.vx *= -1; s.vy *= -1; });
        gravityBodies.forEach(b => { b.vx *= -1; b.vy *= -1; });
        showNotif("Time Reversed ⏪");
    };
    
    window.setTheme = (t) => {
        CONFIG.theme = t;
        stars.forEach(s => s.classify()); // Re-color stars
        initBackground();
        showNotif("Theme: " + t.toUpperCase());
    };
    
    function showNotif(txt) {
        const el = document.getElementById('notification'); el.innerText = txt; el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    }

    document.getElementById('scenario-select').addEventListener('change', resetSim);
    document.getElementById('star-count').addEventListener('input', e => { document.getElementById('count-val').innerText = e.target.value; CONFIG.count = parseInt(e.target.value); });
    document.getElementById('time-scale').addEventListener('input', e => { CONFIG.timeScale = parseFloat(e.target.value); document.getElementById('time-val').innerText = CONFIG.timeScale.toFixed(1) + 'x'; });
    document.getElementById('gravity-strength').addEventListener('input', e => { CONFIG.G = parseFloat(e.target.value); document.getElementById('grav-val').innerText = CONFIG.G; });

    resize(); resetSim(); animate();

</script>
</body>
